<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kỷ niệm đại học — Văn Bảo</title>
<meta name="description" content="Bốn năm thanh xuân được lưu lại qua những bức ảnh, câu chuyện và lời nhắn.">

<!-- Open Graph: controls the thumbnail when sharing via Facebook / Zalo -->
<meta property="og:type" content="website">
<meta property="og:title" content="Kỷ niệm đại học — Văn Bảo">
<meta property="og:description" content="Bốn năm thanh xuân được lưu lại qua những bức ảnh và lời nhắn.">
<meta property="og:locale" content="vi_VN">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,600&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📸</text></svg>">

<!-- Applies the saved theme before first paint. Without this the page would
     render in the system theme and then visibly flip once React mounts. -->
<script>
  try {
    var saved = localStorage.getItem('theme');
    if (saved === 'light' || saved === 'dark') {
      document.documentElement.dataset.theme = saved;
    }
  } catch (e) { /* private mode — fall back to the system theme */ }
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>

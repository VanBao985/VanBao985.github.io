<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kí ức đại học — Văn Bảo</title>
<meta name="description" content="Nơi lưu giữ những kỉ niệm thời sinh viên: ảnh, câu chuyện và những ngày tháng không quay lại.">

<!-- Open Graph: quyết định thumbnail khi share link qua Facebook / Zalo -->
<meta property="og:type" content="website">
<meta property="og:title" content="Kí ức đại học — Văn Bảo">
<meta property="og:description" content="Nơi lưu giữ những kỉ niệm thời sinh viên.">
<meta property="og:locale" content="vi_VN">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,600&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📸</text></svg>">
</head>
<body>

<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="./"><span class="brand__dot"></span>Kí ức đại học</a>
    <nav class="nav">
      <a href="./" aria-current="page">Thư viện</a>
      <a href="admin.html">Quản lí</a>
    </nav>
  </div>
</header>

<main>
  <section class="wrap hero">
    <p class="hero__eyebrow">Bộ sưu tập cá nhân</p>
    <h1>Những ngày <em>không quay lại</em></h1>
    <p class="hero__lede">
      Bốn năm giảng đường, những chuyến đi vội, các đêm deadline và bạn bè —
      gom lại ở đây trước khi kí ức kịp phai.
    </p>
    <div class="hero__stats" id="stats" hidden>
      <div class="stat">
        <span class="stat__num" id="stat-photos">0</span>
        <span class="stat__label">Khoảnh khắc</span>
      </div>
      <div class="stat">
        <span class="stat__num" id="stat-albums">0</span>
        <span class="stat__label">Album</span>
      </div>
      <div class="stat">
        <span class="stat__num" id="stat-span">—</span>
        <span class="stat__label">Khoảng thời gian</span>
      </div>
    </div>
  </section>

  <div class="wrap toolbar" id="toolbar" hidden>
    <div class="chips" id="album-chips" role="group" aria-label="Lọc theo album"></div>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
      </svg>
      <label class="sr-only" for="q">Tìm kiếm kỉ niệm</label>
      <input id="q" type="search" placeholder="Tìm theo tiêu đề, địa điểm, người…" autocomplete="off">
    </div>
  </div>

  <div class="wrap">
    <div id="gallery" class="gallery" aria-live="polite"></div>
    <div id="state" class="state"></div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap site-footer__inner">
    <span>© <span id="year"></span> Văn Bảo — lưu giữ bằng GitHub Pages</span>
    <a href="admin.html">Thêm kỉ niệm mới</a>
  </div>
</footer>

<!-- Lightbox: dựng sẵn trong DOM, chỉ toggle class để tránh layout thrash -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Xem ảnh" hidden>
  <button class="lb-btn lb-btn--close" id="lb-close" aria-label="Đóng (Esc)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <button class="lb-btn lb-btn--prev" id="lb-prev" aria-label="Ảnh trước">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
  </button>
  <button class="lb-btn lb-btn--next" id="lb-next" aria-label="Ảnh sau">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </button>
  <div class="lightbox__stage"><img id="lb-img" alt=""></div>
  <div class="lightbox__info">
    <h3 id="lb-title"></h3>
    <p id="lb-desc"></p>
    <div class="lightbox__meta" id="lb-meta"></div>
  </div>
</div>

<script type="module" src="assets/js/app.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1700" viewBox="0 0 1200 1700">
  <!--
    Demo invitation template.

    Everything static is baked in here; the guest's name is drawn on top by
    src/lib/invitationCard.js at the coordinates in src/data/invitation.js.
    Replace this file with a real exported design (PNG works too) and tune
    those coordinates — nothing else needs to change.

    Font note: this file is rendered as an <img> onto a canvas, which has no
    access to the page's Google Fonts, so it uses system fonts only. Georgia
    is safe here because every string below is English. If you ever put
    Vietnamese text in this file, swap it for a font with real Vietnamese
    glyphs — Georgia renders "Lễ tốt nghiệp" with the accents detached.
  -->
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e8540"/>
      <stop offset="1" stop-color="#1f6b31"/>
    </linearGradient>
    <clipPath id="photoClip">
      <rect x="330" y="380" width="540" height="470" rx="26"/>
    </clipPath>
  </defs>

  <rect width="1200" height="1700" fill="#f1efea"/>

  <!-- Header -->
  <text x="600" y="112" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#2e8540">You are invited to celebrate</text>
  <text x="600" y="234" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="bold" font-size="92" fill="#12592a">Graduation Day</text>

  <!-- Sparkles beside the title. Keep the big one clear of the headline:
       at 92px "Graduation Day" reaches x≈987, so this starts at x≈1000. -->
  <g fill="#f5c518">
    <path d="M1060 96 l16 44 44 16 -44 16 -16 44 -16 -44 -44 -16 44 -16 z"/>
    <path d="M262 372 l13 36 36 13 -36 13 -13 36 -13 -36 -36 -13 36 -13 z"/>
  </g>
  <g fill="none" stroke="#2e8540" stroke-width="5">
    <circle cx="190" cy="800" r="30"/>
    <circle cx="252" cy="742" r="11"/>
  </g>

  <!-- Graduate badge -->
  <rect x="452" y="272" width="296" height="66" rx="14" fill="#2e6b38"/>
  <text x="600" y="316" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="36" fill="#ffffff">Van Bao</text>

  <!-- Photo frame (replace with a real photo in your own export) -->
  <rect x="318" y="368" width="564" height="494" rx="34" fill="none" stroke="#2e8540" stroke-width="18"/>
  <rect x="330" y="380" width="540" height="470" rx="26" fill="#dfe3dc"/>
  <g clip-path="url(#photoClip)" fill="#c3cbbe">
    <circle cx="600" cy="600" r="86"/>
    <path d="M420 850 q180 -170 360 0 z"/>
  </g>
  <text x="600" y="640" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#8a9384">your photo here</text>

  <!-- Cassette -->
  <rect x="150" y="880" width="900" height="440" rx="34" fill="#1d1d1d"/>
  <rect x="168" y="898" width="864" height="404" rx="26" fill="#262626"/>

  <!-- Label: the guest name is drawn over this area -->
  <rect x="212" y="928" width="776" height="238" rx="12" fill="#efe9d8"/>
  <text x="292" y="1112" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#2e6b38">2022</text>
  <text x="912" y="1112" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#2e6b38">2026</text>

  <!-- Reels -->
  <g>
    <circle cx="452" cy="1088" r="66" fill="#111"/>
    <circle cx="452" cy="1088" r="40" fill="#f4f1e8"/>
    <circle cx="452" cy="1088" r="17" fill="#111"/>
    <circle cx="748" cy="1088" r="66" fill="#111"/>
    <circle cx="748" cy="1088" r="40" fill="#f4f1e8"/>
    <circle cx="748" cy="1088" r="17" fill="#111"/>
    <rect x="518" y="1062" width="164" height="52" rx="10" fill="#111"/>
  </g>

  <!-- Player controls band -->
  <rect x="212" y="1180" width="776" height="72" fill="url(#band)"/>
  <g fill="#ffffff">
    <path d="M330 1206 l26 15 -26 15 z"/>
    <path d="M436 1204 l-22 12 22 12 z M440 1204 h7 v24 h-7 z"/>
    <circle cx="600" cy="1216" r="20" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M593 1206 l18 10 -18 10 z"/>
    <path d="M764 1204 l22 12 -22 12 z M757 1204 h7 v24 h-7 z"/>
    <path d="M866 1206 h34 l-8 -8 3 -3 14 13 -14 13 -3 -3 8 -8 h-34 z"/>
  </g>

  <!-- Falling caps -->
  <g fill="#2e6b38">
    <path d="M596 1372 l58 26 -58 26 -58 -26 z"/>
    <path d="M654 1398 v30 l-8 4 v-30 z"/>
  </g>
  <g fill="#f5c518">
    <path d="M980 1330 l14 38 38 14 -38 14 -14 38 -14 -38 -38 -14 38 -14 z"/>
  </g>

  <!-- Time / date -->
  <rect x="128" y="1442" width="392" height="82" rx="41" fill="#ffffff" stroke="#2e8540" stroke-width="5"/>
  <circle cx="222" cy="1483" r="19" fill="none" stroke="#2e6b38" stroke-width="4"/>
  <path d="M222 1472 v12 h9" fill="none" stroke="#2e6b38" stroke-width="4" stroke-linecap="round"/>
  <text x="253" y="1497" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#12592a">At 10:00 AM</text>

  <rect x="700" y="1442" width="372" height="82" rx="41" fill="#2e6b38"/>
  <rect x="757" y="1466" width="34" height="32" rx="5" fill="none" stroke="#ffffff" stroke-width="4"/>
  <path d="M757 1476 h34" stroke="#ffffff" stroke-width="4"/>
  <text x="819" y="1497" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#ffffff">24 July 2026</text>

  <!-- Venue -->
  <rect x="128" y="1546" width="944" height="82" rx="41" fill="#2e6b38"/>
  <circle cx="365" cy="1583" r="15" fill="none" stroke="#ffffff" stroke-width="4"/>
  <circle cx="365" cy="1583" r="5" fill="#ffffff"/>
  <text x="396" y="1598" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#ffffff">National Convention Center</text>

  <text x="600" y="1676" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#8a9384">Call me: your phone number</text>
</svg>
